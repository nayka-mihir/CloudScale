version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cloudscale-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AWS_REGION=ap-south-1
      - AWS_AZ=ap-south-1a
      - INSTANCE_ID=i-0123456789
      - HOSTNAME=ip-10-0-1-25
    restart: unless-stopped
    networks:
      - cloudscale-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloudscale-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudscale-net

networks:
  cloudscale-net:
    driver: bridge
